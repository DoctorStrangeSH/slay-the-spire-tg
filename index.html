<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slay And Spire — Тёмный собор</title>
    <meta name="theme-color" content="#090b10">
    <meta name="app-version" content="2026.11.19.99">
    <link rel="stylesheet" href="css/style.css?v=2026.11.19.99">
    <link rel="stylesheet" href="css/cathedral.css?v=2026.11.19.99">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
    <div id="game-container">
        <!-- Экран загрузки -->
        <div id="loading-screen">
            <h1>Загрузка...</h1>
        </div>

        <!-- Главное меню -->
        <div id="main-menu" style="display: none;">
            <div class="brand-sigil" aria-hidden="true"><img src="assets/cathedral-crest.svg" alt=""></div>
            <p class="brand-kicker">Хроники проклятого шпиля</p>
            <h1>Slay And Spire</h1>
            <p class="brand-subtitle">ОДНА ДОРОГА. ТЫСЯЧА СУДЕБ.</p>
            <div class="brand-divider" aria-hidden="true"></div>
            <button onclick="showHeroSelect()">Новая игра</button>
            <button onclick="continueGame()">Продолжить</button>
            <button type="button" onclick="game.showRunHistory()">🏆 История восхождений</button>
            <div id="player-stats"></div>
            <p id="app-version" class="app-version" aria-label="Версия игры"></p>
        </div>

        <!-- Экран выбора героя -->
        <div id="hero-select" style="display: none;">
            <p class="brand-kicker">Выбор судьбы</p>
            <h2>Выберите героя</h2>
            <button id="hero-back-button" onclick="game.showMenu()">← Главное меню</button>
            <div id="hero-list"></div>
        </div>

        <!-- Боевой экран -->
        <div id="battle-screen" style="display: none;">
            <!-- Враг -->
            <div id="enemy-area">
                <div id="enemy-sprite">👹</div>
                <div id="enemy-info">
                    <div id="enemy-name">Враг</div>
                    <div id="enemy-hp-text">❤️ 0/0</div>
                    <div id="enemy-block"></div>
                    <div id="enemy-intent">⚔️ 0</div>
                    <div id="enemy-effects"></div>
                </div>
            </div>

            <!-- Конструкции (для Инженера) -->
            <div id="buildings-area" style="display: none;"></div>

            <!-- Игрок -->
            <div id="player-area">
                <div id="player-info">
                    <div id="player-name">Игрок</div>
                    <div id="player-hp-text">❤️ 0/0</div>
                    <div id="player-energy">⚡ 3/3</div>
                    <div id="player-block"></div>
                    <div id="player-effects"></div>
                </div>
            </div>

            <!-- Рука карт -->
            <div id="hand-area"></div>

            <!-- Превью эффектов -->
            <div id="battle-preview"></div>

            <!-- Кнопки действий -->
            <div id="action-buttons"></div>
        </div>

        <!-- Экран карты мира -->
        <div id="map-screen" style="display: none;">
            <h2>✦ Карта странствий ✦</h2>
            <div id="map-nodes"></div>
        </div>
    </div>

    <!-- Конфигурация -->
    <script src="js/config/constants.js?v=2026.11.19.99"></script>

    <!-- Данные -->
    <script src="js/data/heroes.js?v=2026.11.19.99"></script>
    <script src="js/data/cards/common.js?v=2026.11.19.99"></script>
    <script src="js/data/cards/berserk.js?v=2026.11.19.99"></script>
    <script src="js/data/cards/engineer.js?v=2026.11.19.99"></script>
    <script src="js/data/cards/psyker.js?v=2026.11.19.99"></script>
    <script src="js/data/cards/index.js?v=2026.11.19.99"></script>
    <script src="js/data/enemies.js?v=2026.11.19.99"></script>
    <script src="js/data/relics.js?v=2026.11.19.99"></script>

    <!-- Системы -->
    <script src="js/systems/battle/BattleCore.js?v=2026.11.19.99"></script>
    <script src="js/systems/battle/BattleEffects.js?v=2026.11.19.99"></script>
    <script src="js/systems/battle/BattleBuildings.js?v=2026.11.19.99"></script>
    <script src="js/systems/battle/BattleCards.js?v=2026.11.19.99"></script>
    <script src="js/systems/battle/BattleTurn.js?v=2026.11.19.99"></script>
    <script src="js/systems/MapGenerator.js?v=2026.11.19.99"></script>
    <script src="js/systems/BattleSystem.js?v=2026.11.19.99"></script>
    <script src="js/systems/RunSave.js?v=2026.11.19.99"></script>
    <script src="js/systems/RunHistory.js?v=2026.11.19.99"></script>
    <script src="js/systems/Game.js?v=2026.11.19.99"></script>

    <!-- UI -->
    <script src="js/ui/CardArt.js?v=2026.11.19.99"></script>
    <script src="js/ui/EnemyArt.js?v=2026.11.19.99"></script>
    <script src="js/ui/BattleFeedback.js?v=2026.11.19.99"></script>
    <script src="js/ui/HeroSelect.js?v=2026.11.19.99"></script>
    <script src="js/ui/BattleUI.js?v=2026.11.19.99"></script>
    <script src="js/ui/MapUI.js?v=2026.11.19.99"></script>

    <!-- Точка входа -->
    <script src="js/main.js?v=2026.11.19.99"></script>
</body>

</html>
